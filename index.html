<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特撮・映画ランダムビューア</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: sans-serif;
            text-align: center;
            box-sizing: border-box;
        }
        .text-box {
            padding: 10px;
            width: 100%;
            max-width: 600px;
        }
        .work-title {
            /* 画面幅に合わせて文字サイズを自動調整しつつ、長文でもはみ出さないようにする */
            font-size: clamp(20px, 5.5vw, 42px);
            font-weight: bold;
            line-height: 1.5;
            color: #4fc3f7;
            white-space: pre-line; /* 手動の改行(\n)のみを反映させる */
            word-break: auto-phrase; /* 可能な限り不自然な位置で折れないようにする設定 */
        }
    </style>
</head>
<body onclick="showRandomText()">

    <div class="text-box">
        <div id="titleArea" class="work-title">読み込み中...</div>
    </div>

<script>

    function showRandomText() {
        if (items.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * items.length);

    }

    window.onload = function() {
        showRandomText();
    };

</html>
